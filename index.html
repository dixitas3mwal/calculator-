
<!DOCTYPE html>
<html>
<head>

<title>Calculator</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    background:linear-gradient(
    135deg,
    #0f172a,
    #1e293b,
    #334155);

    font-family:Arial,sans-serif;
}

.calculator{

    background:#1e293b;

    padding:20px;

    border-radius:20px;

    box-shadow:
    0 0 20px rgba(0,0,0,0.5);

    width:320px;
}

#display{

    width:100%;

    height:70px;

    border:none;

    outline:none;

    background:#0f172a;

    color:white;

    font-size:2rem;

    text-align:right;

    padding:15px;

    border-radius:10px;

    margin-bottom:15px;
}

.buttons{

    display:grid;

    grid-template-columns:repeat(4,1fr);

    gap:10px;
}

button{

    height:60px;

    border:none;

    border-radius:12px;

    font-size:1.1rem;

    cursor:pointer;

    transition:0.2s;
}

button:hover{

    transform:scale(1.05);
}

.number{

    background:#334155;

    color:white;
}

.operator{

    background:#f59e0b;

    color:white;
}

.equal{

    background:#10b981;

    color:white;
}

.clear{

    background:#ef4444;

    color:white;
}

</style>

</head>

<body>

<div class="calculator">

<input type="text" id="display" readonly>

<div class="buttons">

<button class="clear" onclick="clearDisplay()">AC</button>

<button class="clear" onclick="deleteLast()">DEL</button>

<button class="operator" onclick="append('/')">/</button>

<button class="operator" onclick="append('*')">*</button>

<button class="number" onclick="append('7')">7</button>

<button class="number" onclick="append('8')">8</button>

<button class="number" onclick="append('9')">9</button>

<button class="operator" onclick="append('-')">-</button>

<button class="number" onclick="append('4')">4</button>

<button class="number" onclick="append('5')">5</button>

<button class="number" onclick="append('6')">6</button>

<button class="operator" onclick="append('+')">+</button>

<button class="number" onclick="append('1')">1</button>

<button class="number" onclick="append('2')">2</button>

<button class="number" onclick="append('3')">3</button>

<button class="operator" onclick="square()">x²</button>

<button class="number" onclick="append('.')">.</button>

<button class="number" onclick="append('0')">0</button>

<button class="equal"
onclick="calculate()"
style="grid-column:span 2;">
=
</button>

</div>

</div>

<script>


let display =
document.getElementById("display");

function append(digit){

    if(display.value === "Error"){
        display.value = "";
    }

    let str =
    display.value;

    // Don't allow operator at beginning

    if(
        str.length === 0 &&
        (
            digit === "+" ||
            digit === "-" ||
            digit === "*" ||
            digit === "/"
        )
    ){
        return;
    }

    // Prevent multiple decimals

    if(digit === "."){

        for(
            let i = str.length - 1;
            i >= 0;
            i--
        ){

            if(str[i] === "."){
                return;
            }

            if(
                str[i] === "+" ||
                str[i] === "-" ||
                str[i] === "*" ||
                str[i] === "/"
            ){
                break;
            }
        }
    }

    // Replace operator

    if(
        digit === "+" ||
        digit === "-" ||
        digit === "*" ||
        digit === "/"
    ){

        let lastDigit =
        str[str.length - 1];

        if(
            lastDigit === "+" ||
            lastDigit === "-" ||
            lastDigit === "*" ||
            lastDigit === "/"
        ){

            display.value =
            str.substring(
                0,
                str.length - 1
            ) + digit;

            return;
        }
    }

    display.value += digit;
}

function clearDisplay(){

    display.value = "";
}

function deleteLast(){

    display.value =
    display.value.substring(
        0,
        display.value.length - 1
    );
}

function square(){

    let str =
    display.value;

    if(str === ""){
        return;
    }

    let lastDigit =
    str[str.length - 1];

    // Don't square if expression ends with operator

    if(
        lastDigit === "+" ||
        lastDigit === "-" ||
        lastDigit === "*" ||
        lastDigit === "/"
    ){
        return;
    }

    try{

        let value =
        eval(str);

        display.value =
        value * value;

    }

    catch{

        display.value =
        "Error";
    }
}

function calculate(){

    let str =
    display.value;

    if(str === ""){
        return;
    }

    let lastDigit =
    str[str.length - 1];

    // Don't calculate if expression ends with operator

    if(
        lastDigit === "+" ||
        lastDigit === "-" ||
        lastDigit === "*" ||
        lastDigit === "/"
    ){
        return;
    }

    try{

        display.value =
        eval(str);

    }

    catch{

        display.value =
        "Error";
    }
}

document.addEventListener(
"keydown",
function(event){

    let key =
    event.key;

    if(
        "0123456789+-*/."
        .includes(key)
    ){

        append(key);
    }

    else if(
        key === "Enter"
    ){

        calculate();
    }

    else if(
        key === "Backspace"
    ){

        deleteLast();
    }

    else if(
        key === "Escape"
    ){

        clearDisplay();
    }
});

                    
        

</script>

</body>
</html>
